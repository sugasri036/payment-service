apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: investra
spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: payment-service:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          envFrom:
            - secretRef:
                name: payment-service-secret

          resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5