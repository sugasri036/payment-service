# =====================================================
# APPLICATION
# =====================================================

spring.application.name=payment-service
server.port=8082


# =====================================================
# EUREKA CLIENT
# =====================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# =====================================================
# DATABASE - H2
# =====================================================

spring.datasource.url=jdbc:h2:file:./data/paymentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# =====================================================
# H2 CONSOLE
# =====================================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# =====================================================
# RAZORPAY
# =====================================================

razorpay.key.id=rzp_test_TQL7WW3J6KMWr0
razorpay.key.secret=WDNLmISE1GdrrppBXerStOXP
razorpay.webhook.secret=my_payment_webhook_2026


# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always